name: Validate VINCÓ native app

on:
  push:
    branches:
      - fix/reliable-incoming-message-sound
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir /tmp/vinco-export-ios
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir /tmp/vinco-export-android
      - name: Expo Doctor
        run: npx expo-doctor
