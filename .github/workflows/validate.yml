name: Validate VINCÓ native app

on:
  push:
    branches:
      - fix/reliable-incoming-message-sound
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo Doctor
        run: npx expo-doctor
